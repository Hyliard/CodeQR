<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Genera códigos QR para tus enlaces.">
    <meta name="color-scheme" content="light dark">
    <title>Generador de QR</title>
    <link rel="icon" type="image/png" href="assets/images/Gaming Logo.png">
    <link rel="stylesheet" href="styles.css">
    <script>
        document.documentElement.dataset.theme = localStorage.getItem('theme') ||
            (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    </script>
    <script src="assets/js/qrcode.min.js" defer></script>
    <script src="script.js" defer></script>
</head>
<body>
    <header class="header">
        <button id="theme" class="theme" type="button" aria-label="Cambiar tema">
            <img class="moon" src="assets/icons/moon.svg" alt="">
            <img class="sun" src="assets/icons/sun.svg" alt="">
        </button>
    </header>

    <main>
        <section class="card">
            <h1>Generador de QR</h1>
            <p>Crea un QR para un enlace o para que se conecten a tu WiFi.</p>

            <div class="tabs" role="tablist">
                <button class="tab active" type="button" role="tab" data-mode="url" aria-selected="true">Enlace</button>
                <button class="tab" type="button" role="tab" data-mode="wifi" aria-selected="false">WiFi</button>
            </div>

            <form id="form" novalidate>
                <div id="urlFields">
                    <label for="link">Enlace</label>
                    <div class="row">
                        <input type="url" id="link" placeholder="https://ejemplo.com"
                            autocomplete="url" inputmode="url" aria-describedby="msg">
                        <button class="btn primary" type="submit">Generar</button>
                    </div>
                </div>

                <div id="wifiFields" class="wifi" hidden>
                    <label class="wide">Nombre de la red
                        <input id="ssid" placeholder="MiCasa_5G" autocomplete="off" spellcheck="false">
                    </label>
                    <label>Contraseña
                        <input id="pass" type="password" autocomplete="off" spellcheck="false">
                    </label>
                    <label>Seguridad
                        <select id="security">
                            <option value="WPA">WPA / WPA2</option>
                            <option value="WEP">WEP</option>
                            <option value="nopass">Sin contraseña</option>
                        </select>
                    </label>
                    <div class="checks wide">
                        <label class="check"><input id="show" type="checkbox"> Mostrar contraseña</label>
                        <label class="check"><input id="hiddenNet" type="checkbox"> Red oculta</label>
                    </div>
                    <button class="btn primary wide" type="submit">Generar</button>
                </div>

                <p id="msg" class="msg" role="status" aria-live="polite"></p>
            </form>

            <div id="result" class="result" hidden>
                <div id="qr"></div>

                <div id="fields" class="fields">
                    <label>Nombre del archivo
                        <input id="name" placeholder="qr" maxlength="60">
                    </label>
                    <label>Título
                        <input id="title" value="¡Escaneá el QR!" maxlength="30">
                    </label>
                    <label class="wide">Color
                        <input id="color" type="color" value="#3d59a1">
                    </label>
                </div>

                <canvas id="poster" width="1200" height="1250" aria-label="Vista previa del cartel"></canvas>

                <div class="actions">
                    <button id="download" class="btn" type="button">Descargar QR</button>
                    <button id="downloadPoster" class="btn primary" type="button">Descargar cartel</button>
                    <button id="copy" class="btn" type="button">Copiar enlace</button>
                    <button id="reset" class="btn" type="button">Nuevo</button>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer"></footer>
</body>
</html>
