<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Genera códigos QR para tus enlaces.">
    <meta name="color-scheme" content="light dark">
    <title>Generador de QR</title>
    <link rel="icon" type="image/png" href="assets/images/Gaming Logo.png">
    <link rel="stylesheet" href="styles.css">
    <script>
        document.documentElement.dataset.theme = localStorage.getItem('theme') ||
            (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    </script>
    <script src="assets/js/qrcode.min.js" defer></script>
    <script src="script.js" defer></script>
</head>
<body>
    <header class="header">
        <button id="theme" class="theme" type="button" aria-label="Cambiar tema">
            <img class="moon" src="assets/icons/moon.svg" alt="">
            <img class="sun" src="assets/icons/sun.svg" alt="">
        </button>
    </header>

    <main>
        <section class="card">
            <h1>Generador de QR</h1>
            <p>Enlaces, WiFi, contactos, mensajes, ubicaciones y eventos.</p>

            <div class="tabs" role="tablist">
                <button class="tab active" type="button" role="tab" data-mode="url" aria-selected="true">Enlace</button>
                <button class="tab" type="button" role="tab" data-mode="wifi" aria-selected="false">WiFi</button>
                <button class="tab" type="button" role="tab" data-mode="contact" aria-selected="false">Contacto</button>
                <button class="tab" type="button" role="tab" data-mode="sms" aria-selected="false">SMS</button>
                <button class="tab" type="button" role="tab" data-mode="tel" aria-selected="false">Teléfono</button>
                <button class="tab" type="button" role="tab" data-mode="geo" aria-selected="false">Ubicación</button>
                <button class="tab" type="button" role="tab" data-mode="event" aria-selected="false">Evento</button>
            </div>

            <form id="form" novalidate>
                <div class="panel grid" data-mode="url">
                    <label class="wide">Enlace
                        <input type="url" id="link" placeholder="https://ejemplo.com" autocomplete="url" inputmode="url">
                    </label>
                </div>

                <div class="panel grid" data-mode="wifi" hidden>
                    <label class="wide">Nombre de la red
                        <input id="ssid" placeholder="MiCasa_5G" autocomplete="off" spellcheck="false">
                    </label>
                    <label>Contraseña
                        <input id="pass" type="password" autocomplete="off" spellcheck="false">
                    </label>
                    <label>Seguridad
                        <select id="security">
                            <option value="WPA">WPA / WPA2</option>
                            <option value="WEP">WEP</option>
                            <option value="nopass">Sin contraseña</option>
                        </select>
                    </label>
                    <div class="checks wide">
                        <label class="check"><input id="show" type="checkbox"> Mostrar contraseña</label>
                        <label class="check"><input id="hiddenNet" type="checkbox"> Red oculta</label>
                    </div>
                </div>

                <div class="panel grid" data-mode="contact" hidden>
                    <label>Nombre <input id="cFirst" autocomplete="given-name"></label>
                    <label>Apellido <input id="cLast" autocomplete="family-name"></label>
                    <label>Teléfono <input id="cPhone" type="tel" autocomplete="tel"></label>
                    <label>Email <input id="cEmail" type="email" autocomplete="email"></label>
                    <label>Empresa <input id="cOrg" autocomplete="organization"></label>
                    <label>Cargo <input id="cRole" autocomplete="organization-title"></label>
                    <label class="wide">Sitio web <input id="cWeb" type="url" placeholder="https://"></label>
                    <label class="wide">Dirección <input id="cAddr" autocomplete="street-address"></label>
                </div>

                <div class="panel grid" data-mode="sms" hidden>
                    <label class="wide">Número <input id="sPhone" type="tel" placeholder="+54 9 11 1234 5678"></label>
                    <label class="wide">Mensaje <textarea id="sBody" rows="3"></textarea></label>
                </div>

                <div class="panel grid" data-mode="tel" hidden>
                    <label class="wide">Número <input id="tPhone" type="tel" placeholder="+54 9 11 1234 5678"></label>
                </div>

                <div class="panel grid" data-mode="geo" hidden>
                    <div class="wide">
                        <label for="geo">Coordenadas</label>
                        <div class="row">
                            <input id="geo" placeholder="-34.6037, -58.3816" inputmode="decimal">
                            <button id="locate" class="btn" type="button">Mi ubicación</button>
                        </div>
                    </div>
                    <p class="note wide">En Google Maps, clic derecho sobre el lugar y copiá las coordenadas.</p>
                </div>

                <div class="panel grid" data-mode="event" hidden>
                    <label class="wide">Título <input id="eTitle"></label>
                    <label>Inicio <input id="eStart" type="datetime-local"></label>
                    <label>Fin <input id="eEnd" type="datetime-local"></label>
                    <label class="wide">Lugar <input id="ePlace"></label>
                    <label class="wide">Descripción <textarea id="eNotes" rows="2"></textarea></label>
                </div>

                <button class="btn primary generate" type="submit">Generar QR</button>
                <p id="msg" class="msg" role="status" aria-live="polite"></p>
            </form>

            <div id="result" class="result" hidden>
                <div id="qr"></div>

                <div id="fields" class="fields">
                    <label>Nombre del archivo
                        <input id="name" placeholder="qr" maxlength="60">
                    </label>
                    <label>Título
                        <input id="title" value="¡Escaneá el QR!" maxlength="30">
                    </label>
                    <label class="wide">Color
                        <input id="color" type="color" value="#3d59a1">
                    </label>
                </div>

                <canvas id="poster" width="1200" height="1250" aria-label="Vista previa del cartel"></canvas>

                <div class="actions">
                    <button id="download" class="btn" type="button">Descargar QR</button>
                    <button id="downloadPoster" class="btn primary" type="button">Descargar cartel</button>
                    <button id="copy" class="btn" type="button">Copiar enlace</button>
                    <button id="reset" class="btn" type="button">Nuevo</button>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer"></footer>
</body>
</html>
