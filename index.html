<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Genera códigos QR para enlaces de forma rápida y sencilla.">
    <title>Generador de Código QR</title>
    <link rel="stylesheet" href="styles.css">
    <script src="assets/js/qrcode.min.js" defer></script>
    <script src="script.js" defer></script>
</head>
<body>
    <header class="site-header">
        <button class="theme-toggle" id="themeToggle" type="button" aria-label="Activar modo oscuro">
            <img class="theme-toggle__icon theme-toggle__icon--moon" src="assets/icons/moon.svg" alt="" aria-hidden="true">
            <img class="theme-toggle__icon theme-toggle__icon--sun" src="assets/icons/sun.svg" alt="" aria-hidden="true">
            <span id="themeText">Modo oscuro</span>
        </button>
    </header>

    <main class="qr-card">
        <h1>Generador de Código QR</h1>
        <p class="intro">Pega un enlace y crea un código listo para escanear.</p>
        <form id="qrForm" novalidate>
            <label for="linkInput">Enlace</label>
            <div class="form-row">
                <input type="url" id="linkInput" name="link" placeholder="https://ejemplo.com"
                    autocomplete="url" inputmode="url" required aria-describedby="formMessage">
                <button class="generate-button" type="submit">Generar QR</button>
            </div>
            <p id="formMessage" class="form-message" role="status" aria-live="polite"></p>
        </form>
        <section id="qrResult" class="qr-result" aria-label="Código QR generado" hidden>
            <div id="qrCode" class="qr-code"></div>
            <p>Escanea el código con la cámara de tu dispositivo.</p>
        </section>
    </main>

    <footer class="site-footer"><p>Generador de Código QR</p></footer>
</body>
</html>
